<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The manifest is generated and injected by vite-plugin-pwa; it is
         configured in vite.config.ts, not in a file of its own. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept in step with the chosen theme by ThemeProvider. The value here
         is the light one, so the first paint is right before React runs. -->
    <meta name="theme-color" content="#f1f5fa" />
    <title>Osefi srl</title>
  </head>
  <body>
    <script>
      // Paints the stored theme before React mounts; the ThemeProvider only
      // applies it in an effect, which is one frame too late and flashes.
      // Storage key and fallback must match <ShadcnThemeProvider> in App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("osefi-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : stored === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light"
                : "light";
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
